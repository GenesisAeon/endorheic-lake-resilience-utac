[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "endorheic-lake-resilience-utac"
version = "0.0.1"
description = "Resilience of shrinking endorheic salt lakes, starting with Tuz Gölü (scaffold, no results)."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Johann Benjamin Römer", email = "jbroemer@web.de" }]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4", "mypy>=1.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/endorheic_lake_resilience_utac"]

[tool.pytest.ini_options]
testpaths = ["tests"]
